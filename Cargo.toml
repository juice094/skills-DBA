[package]
name = "skills-dba"
version = "0.1.0"
edition = "2021"
description = "Skills Database Administration — local skill index, search, and recommendation engine with multi-source async sync"
license = "MIT"
repository = "https://github.com/juice094/skills-DBA"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "vtab", "column_decltype"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[lib]
name = "skills_dba"
path = "src/lib.rs"
